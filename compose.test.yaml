name: elbravodeljac-backend-tests
services:
  postgres-test:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: elbravodeljac_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Generate an ephemeral test password}
    # No ports and no persistent volumes: never reuses the user's database.
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./database/postgresql/esquema_actual.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./backend/internal/platform/postgres/migrations/001_revision_funcional.sql:/docker-entrypoint-initdb.d/002-functional.sql:ro
      - ./backend/internal/platform/postgres/migrations/002_marcas_vehiculos.sql:/docker-entrypoint-initdb.d/003-brands.sql:ro
      - ./backend/internal/platform/postgres/migrations/003_atencion_ficha.sql:/docker-entrypoint-initdb.d/004-attention.sql:ro
      - ./backend/internal/platform/postgres/migrations/004_flujo_diagnosticos.sql:/docker-entrypoint-initdb.d/005-diagnostics.sql:ro
      - ./backend/internal/platform/postgres/migrations/005_auditoria_flujo.sql:/docker-entrypoint-initdb.d/006-audit.sql:ro
      - ./backend/internal/platform/postgres/migrations/006_pagos_entrega.sql:/docker-entrypoint-initdb.d/007-payments.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elbravodeljac_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [test-only]
  mongo-test:
    image: mongo:9.0
    command: ["mongod", "--bind_ip_all", "--setParameter", "enableTestCommands=true"]
    # Test-only internal network; no published ports or external data volumes.
    tmpfs:
      - /data/db
      - /data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [test-only]
  tests:
    build:
      context: .
      dockerfile: backend/Dockerfile.test
    environment:
      INTEGRATION_DATABASE_URL: postgres://postgres:${TEST_POSTGRES_PASSWORD}@postgres-test:5432/elbravodeljac_test?sslmode=disable
      INTEGRATION_MONGODB_URI: mongodb://mongo-test:27017/?directConnection=true&retryWrites=false
      INTEGRATION_MONGODB_DATABASE: elbravodeljac_tecnico_test
    depends_on:
      postgres-test:
        condition: service_healthy
      mongo-test:
        condition: service_healthy
    networks: [test-only]
networks:
  test-only:
    internal: true
