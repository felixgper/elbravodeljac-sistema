name: elbravodeljac-phase-a-tests
services:
  postgres-test:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: elbravodeljac_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Generate an ephemeral test password}
    # No ports and no persistent volumes: never reuses the user's database.
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./database/postgresql/esquema_actual.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elbravodeljac_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [test-only]
  tests:
    build:
      context: .
      dockerfile: backend/Dockerfile.test
    environment:
      INTEGRATION_DATABASE_URL: postgres://postgres:${TEST_POSTGRES_PASSWORD}@postgres-test:5432/elbravodeljac_test?sslmode=disable
    depends_on:
      postgres-test:
        condition: service_healthy
    networks: [test-only]
networks:
  test-only:
    internal: true
