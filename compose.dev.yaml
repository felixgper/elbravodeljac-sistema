name: elbravodeljac-isolated-dev
services:
  postgres-dev:
    image: postgres:18.6
    environment:
      POSTGRES_DB: elbravodeljac_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:?Set a private development password}
    volumes:
      - pg-dev:/var/lib/postgresql
      - ./database/postgresql/esquema_actual.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elbravodeljac_dev"]
      interval: 3s
      timeout: 5s
      retries: 30
    networks: [dev-only]
  mongo-dev:
    image: mongo:9.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: devroot
      MONGO_INITDB_ROOT_PASSWORD: ${DEV_MONGO_PASSWORD:?Set a private development password}
    volumes:
      - mongo-dev:/data/db
      - mongo-config-dev:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 3s
      timeout: 5s
      retries: 30
    networks: [dev-only]
  mongo-init:
    profiles: [setup]
    build:
      context: .
      dockerfile: backend/Dockerfile.test
    command: ["go", "run", "./cmd/mongo-init"]
    environment:
      MONGODB_URI: mongodb://devroot:${DEV_MONGO_PASSWORD}@mongo-dev:27017/?authSource=admin
      MONGODB_DATABASE: elbravodeljac_tecnico_dev
    depends_on:
      mongo-dev:
        condition: service_healthy
    networks: [dev-only]
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile.test
    command: ["go", "run", "./cmd/api"]
    environment:
      HTTP_ADDR: 0.0.0.0:8080
      APP_ORIGIN: http://localhost:8080
      COOKIE_SECURE: "false"
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Generate a private random signing key}
      POSTGRES_DSN: postgres://postgres:${DEV_POSTGRES_PASSWORD}@postgres-dev:5432/elbravodeljac_dev?sslmode=disable
      MONGODB_URI: mongodb://devroot:${DEV_MONGO_PASSWORD}@mongo-dev:27017/?authSource=admin
      MONGODB_DATABASE: elbravodeljac_tecnico_dev
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres-dev:
        condition: service_healthy
      mongo-dev:
        condition: service_healthy
    networks: [dev-only, web-entry]
  db-migrate:
    profiles: [setup]
    build:
      context: .
      dockerfile: backend/Dockerfile.test
    command: ["go", "run", "./cmd/db-migrate"]
    environment:
      POSTGRES_DSN: postgres://postgres:${DEV_POSTGRES_PASSWORD}@postgres-dev:5432/elbravodeljac_dev?sslmode=disable
    networks: [dev-only]
  dev-bootstrap:
    profiles: [setup]
    build:
      context: .
      dockerfile: backend/Dockerfile.test
    command: ["go", "run", "./cmd/dev-bootstrap"]
    environment:
      POSTGRES_DSN: postgres://postgres:${DEV_POSTGRES_PASSWORD}@postgres-dev:5432/elbravodeljac_dev?sslmode=disable
      DEV_BOOTSTRAP_CONFIRM: elbravodeljac_dev
      DEV_ADMIN_USERNAME: ${DEV_ADMIN_USERNAME:-admin_pruebas}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-}
    depends_on:
      postgres-dev:
        condition: service_healthy
    networks: [dev-only]
volumes:
  pg-dev:
  mongo-dev:
  mongo-config-dev:
networks:
  dev-only:
    internal: true
  # Only Go joins this network. Database services remain on dev-only with no
  # published ports. Docker Desktop needs a non-internal entry for host binding.
  web-entry:
